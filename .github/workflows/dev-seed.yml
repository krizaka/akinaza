# The cast on the dev deployment (krizaka/.github#356): the same `seed --cast` as local, CI and the recorders, so a bug seen on dev
# reproduces on a laptop. Run by hand (or after a dev deploy) from the `dev` GitHub environment, which holds the database and the
# QA accounts as environment secrets. It fails closed: a missing secret stops the job with its name; nothing is ever printed.
name: Dev seed

on:
  workflow_dispatch:

permissions: {}

jobs:
  seed:
    name: Seed the cast on dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    env:
      APP_ENVIRONMENT: dev
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      APP_DATA_ENCRYPTION_KEY: ${{ secrets.APP_DATA_ENCRYPTION_KEY }}
      QA_WALKER_PASSWORD: ${{ secrets.QA_WALKER_PASSWORD }}
      QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
      QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
      QA_CLIENTS_PASSWORD: ${{ secrets.QA_CLIENTS_PASSWORD }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
    steps:
      - name: Check the environment secrets (fail closed)
        run: |
          missing=""
          for name in DATABASE_URL DATABASE_CA_CERT APP_DATA_ENCRYPTION_KEY QA_WALKER_PASSWORD QA_CLIENTS_PASSWORD QA_USER_EMAIL QA_USER_PASSWORD QA_ADMIN_EMAIL QA_ADMIN_PASSWORD; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::The dev environment lacks the secret(s):$missing. Add them in Settings > Environments > dev; nothing was seeded."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Seed the cast and compare the fingerprint
        run: pnpm --filter @akinaza/web exec tsx scripts/seed-cast.mjs --check
