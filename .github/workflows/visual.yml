name: Visual regression

# The main journeys (landing, a shop page, a service, sign-in, the walker's day; desktop + phone, light + dark) compared to their Linux
# baselines, as the seeded cast (krizaka/.github#375). The pipeline is the org's.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    uses: krizaka/.github/.github/workflows/visual-regression.yml@642180b4efde3fff680d9b61abc7f86831f5eb15 # main
    permissions:
      contents: read
    with:
      package-manager: pnpm
      start-script: scripts/ci-visual-start.sh
      test-command: pnpm exec playwright test -c apps/web/e2e/visual/playwright.config.mjs
      snapshot-paths: apps/web/e2e/visual/__screenshots__
      env: |
        E2E_EMAIL=lea.beaulieu@akinaza.test
        E2E_PASSWORD=local-cast-password-0123
