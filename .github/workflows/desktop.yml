# The Mac app (.): the org's reusable Tauri pipeline (krizaka/.github tauri-macos.yml, ADR-005). The checks run on
# every pull request that touches the app or the contracts it reads; a `desktop-v*` tag builds the arm64 .dmg and attaches it
# to the release (signed and notarised once the Apple secrets exist).
name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    permissions:
      contents: write
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@6a458eafcbe9e52b3aa9e068c7256fe0a11bc376 # main
    with:
      working-directory: apps/desktop
      product-name: Akinaza
    secrets: inherit # zizmor: ignore[secrets-inherit] the org's own reusable workflow, pinned by SHA, needs the signing secrets
