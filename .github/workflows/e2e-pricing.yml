# The pricing journey on dev, with the payment processor's TEST card (krizaka-internal#47): on demand only, never required, so it cannot block a merge.
# It runs against the deployed dev app (its own test-mode key and webhook), not a local stack: dispatch it once the dev deployment carries the change.
# Secrets are the dev demo personas' sign-ins (repository secrets, never printed); the captures are an artifact (7 days) for the PR body.
name: E2E pricing (dev, test card)

on:
  workflow_dispatch:
    inputs:
      base:
        description: The dev app to walk through
        default: https://dev.akinaza.com
        required: true

permissions:
  contents: read

jobs:
  pricing:
    name: Pricing journey (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: The journey (Starter free months with the test card; the association's NEQ approval)
        env:
          E2E_BASE: ${{ inputs.base }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_ASSO_EMAIL: ${{ secrets.E2E_ASSO_EMAIL }}
          E2E_ASSO_PASSWORD: ${{ secrets.E2E_ASSO_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SHOTS: ${{ github.workspace }}/pricing-shots
        run: node scripts/e2e-pricing.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pricing-shots
          path: pricing-shots
          retention-days: 7
