# Org security scan (krizaka/.github#324): gitleaks (secrets) and zizmor (GitHub Actions), reusable and pinned.
name: Security scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

# A new push or an update-branch supersedes the scan of the same PR: cancel it (the queue and main runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security scan
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/security-scan.yml@085431df70d0a783dfd05f821de97ac63cb7269c # main
