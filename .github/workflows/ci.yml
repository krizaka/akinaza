name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the pnpm and Playwright caches,
  # the timeouts and the gate that always reports live there. This file says only what is Akinaza's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@1cb2e1b6f572ba712083cb6f05fd041370c5ea0b # v1.5.0
    permissions:
      contents: read
    with:
      duplication: true      # jscpd + dup-ratchet.json: duplicated lines may only go down
      package-manager: pnpm
      parallel: true      # lint, typecheck, tests and build+SEO/overflow checks side by side
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: akinaza
      # Test values only — no real secret anywhere. The database tests create a database per file on this server.
      env: |
        DATABASE_URL=postgresql://akinaza:ci-only-password@localhost:5432/akinaza
        DATABASE_IT=1
      playwright: chromium
      # SEO family contract on the built site, sign-up closed, no horizontal overflow (scripts/ci-after-build.sh).
      after-build: scripts/ci-after-build.sh
      # Files no test or build reads skip the heavy jobs (docs/, policy text, templates, the README's images). Fails open.
      ignore: '^docs/|^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|assets/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
