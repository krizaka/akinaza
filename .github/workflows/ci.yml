name: CI
# main is protected by a merge queue (merge_group below): a pull request merges only after CI passes on its entry.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the pnpm and Playwright caches,
  # the timeouts and the gate that always reports live there. This file says only what is Akinaza's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@07c5db4045e7e31e462da7069df5debbdac9bf80 # main (merge queue, layout guard)
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # SonarCloud CI analysis after the tests, with the coverage of every package (krizaka/.github#237).
      sonar: true
      sonar-coverage-paths: |
        coverage/lcov.info
        apps/*/coverage/lcov.info
        packages/*/coverage/lcov.info
      test-script: test:coverage
      container: true      # the image is built on every PR that can break it (Dockerfile, manifests, lockfiles, COPY paths)
      container-dockerfile: deploy/docker/Dockerfile
      container-image: app:ci
      # What App Platform passes as build arguments: indexing off (a dev build), a placeholder commit.
      container-build-args: |
        APP_SEARCH_INDEXING=off
        APP_COMMIT_SHA=ci
      duplication: true      # jscpd + dup-ratchet.json: duplicated lines may only go down
      package-manager: pnpm
      parallel: true      # lint, typecheck, tests and build+SEO/overflow checks side by side
      typecheck-script: typecheck
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: akinaza
      # Test values only — no real secret anywhere. The database tests create a database per file on this server.
      env: |
        DATABASE_URL=postgresql://akinaza:ci-only-password@localhost:5432/akinaza
        DATABASE_IT=1
        APP_PUBLIC_URL=http://localhost:3000
      playwright: chromium
      # SEO family contract on the built site, sign-up closed, no horizontal overflow (scripts/ci-after-build.sh).
      after-build: scripts/ci-after-build.sh
      # Files no test or build reads skip the heavy jobs (docs/, policy text, templates, the README's images). Fails open.
      ignore: '^docs/|^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|assets/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
