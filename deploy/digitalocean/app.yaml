# akinaza dev — DigitalOcean App Platform (TOR1), smallest instance: dev.akinaza.com. Secrets are DO SECRETs, filled from the
# maintainer's local secrets store (never committed): each __NAME__ below is replaced by the deploy session, then
#   doctl apps create --spec <rendered>   (or  doctl apps update <APP_ID> --spec <rendered>).
# The database is akinaza_db on krizaka-dev-pg behind its PgBouncer pool (transaction mode, size 2); migrations run at start
# on the direct URL.
name: akinaza-dev
region: tor
domains:
  # The public address (epic krizaka/.github#119): www is primary and indexed, the apex answers 308 with www (ingress below).
  - domain: www.akinaza.com
    type: PRIMARY
  - domain: akinaza.com
    type: ALIAS
    # And every <slug>.akinaza.com: a shop's own address (#77, level 2; lib/host.ts shopOfHost). Certificate by TXT tokens on Porkbun.
    wildcard: true
  # The development address: every page goes to www (308); the API, .well-known and healthz keep serving, noindex (APP_DEV_HOST).
  - domain: dev.akinaza.com
    type: ALIAS
  # The administration console: the same app, host-routed (lib/host.ts); session + ADMIN role + AUTH_ALLOWED_IPS.
  - domain: admin.akinaza.com
    type: ALIAS
# The apex leads to www (308); the other hosts are the app's (dev's page redirect and noindex are the app's own: lib/indexing.ts).
ingress:
  rules:
    - match:
        authority:
          exact: akinaza.com
      redirect:
        authority: www.akinaza.com
        redirect_code: 308
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    github:
      repo: krizaka/akinaza
      branch: main
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: APP_PUBLIC_URL
        scope: RUN_TIME
        value: https://www.akinaza.com
      - key: APP_DEV_HOST
        scope: RUN_TIME
        value: dev.akinaza.com
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      # Every dev deployment: noindex and a closed robots.txt on every host but www (the public address), the development notice in the footer.
      - key: APP_SEARCH_INDEXING
        scope: RUN_AND_BUILD_TIME
        value: "off"
      - key: AUTH_SIGNUP_ENABLED
        scope: RUN_TIME
        value: "false"
      # Only these client addresses (do-connecting-ip) reach admin.akinaza.com, its sign-in included; empty = nobody.
      # (krizaka-deploy keeps the live value: the addresses are not committed.)
      - key: AUTH_ALLOWED_IPS
        scope: RUN_TIME
        value: __AUTH_ALLOWED_IPS__
      - key: AUTH_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: __AUTH_SESSION_SECRET__
      # Seals the access notes (keys, door codes) at rest — 32 random bytes, base64. Required: the server refuses to start without it.
      - key: APP_DATA_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: __APP_DATA_ENCRYPTION_KEY__
      # Outgoing mail (the walk report). Not configured on dev yet: every mail stays `pending` in the outbox. To enable, add
      # MAIL_PROVIDER=mailgun, MAIL_DOMAIN, MAIL_FROM (values) and MAIL_API_KEY (SECRET).
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_URL__
      - key: DATABASE_DIRECT_URL
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_DIRECT_URL__
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_CA_CERT__
      # Connection budget (krizaka/.github#60): the cluster's pool for this database is 2 server connections, so one
      # process holds at most 2; one instance, so the realtime bus lives in memory (no LISTEN connection).
      # (live: 1 — one process, one connection through the pool, until the cluster's budget grows.)
      - key: DATABASE_MAX_CONNECTIONS
        scope: RUN_TIME
        value: "1"
      - key: REALTIME_BUS
        scope: RUN_TIME
        value: memory
      - key: ABUSE_CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
      # The media zone of this site on Bunny (akinaza-dev; its own zone, never the krizaka-assets one): the storage key is a SECRET.
      - key: MEDIA_STORAGE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: __MEDIA_STORAGE_API_KEY__
      - key: MEDIA_STORAGE_ZONE
        scope: RUN_TIME
        value: akinaza-dev
      - key: MEDIA_STORAGE_ENDPOINT
        scope: RUN_TIME
        value: ny.storage.bunnycdn.com
      - key: MEDIA_CDN_HOSTNAME
        scope: RUN_TIME
        value: akinaza-dev.b-cdn.net
