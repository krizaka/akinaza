# akinaza dev — DigitalOcean App Platform (TOR1), smallest instance: dev.akinaza.com. Secrets are DO SECRETs, filled from the
# maintainer's local secrets store (never committed): each __NAME__ below is replaced by the deploy session, then
#   doctl apps create --spec <rendered>   (or  doctl apps update <APP_ID> --spec <rendered>).
# The database is akinaza_db on krizaka-dev-pg behind its PgBouncer pool (transaction mode, size 2); migrations run at start
# on the direct URL.
name: akinaza-dev
region: tor
domains:
  - domain: dev.akinaza.com
    type: PRIMARY
services:
  - name: web
    github:
      repo: krizaka/akinaza
      branch: main
      deploy_on_push: true
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: APP_PUBLIC_URL
        scope: RUN_TIME
        value: https://dev.akinaza.com
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      # Every dev deployment: noindex on every response, robots.txt closed, the development notice in the footer.
      - key: APP_SEARCH_INDEXING
        scope: RUN_AND_BUILD_TIME
        value: "off"
      - key: AUTH_SIGNUP_ENABLED
        scope: RUN_TIME
        value: "false"
      - key: AUTH_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: __AUTH_SESSION_SECRET__
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_URL__
      - key: DATABASE_DIRECT_URL
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_DIRECT_URL__
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: __DATABASE_CA_CERT__
      # Connection budget (krizaka/.github#60): the cluster's pool for this database is 2 server connections, so one
      # process holds at most 2; one instance, so the realtime bus lives in memory (no LISTEN connection).
      - key: DATABASE_MAX_CONNECTIONS
        scope: RUN_TIME
        value: "2"
      - key: REALTIME_BUS
        scope: RUN_TIME
        value: memory
      - key: ABUSE_CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
