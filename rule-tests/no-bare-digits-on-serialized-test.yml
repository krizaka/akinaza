id: no-bare-digits-on-serialized
valid:
  - |
    expect(JSON.stringify(payload)).not.toMatch(/514-555-0100|Camille/);
  - |
    expect(JSON.stringify(t)).not.toMatch(/\b\d+ ?\$/);
  - |
    expect(JSON.stringify(m)).not.toMatch(/\bIA\b|intelligen/i);
invalid:
  - |
    expect(JSON.stringify(told[0].payload)).not.toMatch(/514|Chien|fullName/);
  - |
    expect(JSON.stringify(body)).not.toMatch(/42/);
