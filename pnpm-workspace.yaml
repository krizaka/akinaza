packages:
  - "apps/*"
  - "packages/*"
  # The Expo app joins the workspace in the mobile phase (A5): installing React Native on every CI run before then costs
  # minutes for nothing it tests.
  - "!apps/mobile"
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Dependabot: @esbuild-kit/core-utils (drizzle-kit) pins esbuild 0.18.20, whose dev-server CORS flaw is fixed from 0.25.0.
overrides:
  "esbuild@0.18.20": "0.25.12"
