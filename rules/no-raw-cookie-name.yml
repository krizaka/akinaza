id: no-raw-cookie-name
language: Tsx
severity: error
message: "The name of a cookie of the app goes through `cookieName(...)` of lib/cookie.ts: on https it is `__Host-` prefixed, and a literal name would miss the prefix."
note: "ADR-005 slice 1, folioviv#534. `SESSION_COOKIE`, `SHOP_COOKIE` are already named; a new cookie is `cookieName(\"folioviv_<what>\")`."
rule:
  kind: string
  regex: ^["'](folioviv_session|folioviv_shop|NEXT_LOCALE)["']$
  not:
    inside:
      stopBy: end
      kind: call_expression
      has:
        field: function
        regex: ^cookieName$
ignores:
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/__tests__/**"
  - "**/tests/**"
  - "scripts/**"
