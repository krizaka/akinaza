<h1 style="margin:0 0 16px;font-family:'Outfit',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#09090b;">Your invoice</h1>
<p style="margin:0 0 16px;">Invoice <strong>{number}</strong> from {shop}: <strong>{total}</strong>, including GST {gst} and QST {qst}. Due {dueDate}.</p>
{#hasMessage}<p style="margin:0 0 16px;">{message}</p>{/hasMessage}
<p style="margin:24px 0;"><a href="{url}" style="display:inline-block;padding:12px 20px;border-radius:8px;background-color:#1f6b3a;color:#ffffff;font-weight:700;text-decoration:none;">See the invoice</a></p>
{#hasLogo}<p style="margin:0 0 16px;"><img src="{logo}" alt="{shop}" width="160" style="max-width:160px;height:auto;"></p>{/hasLogo}
