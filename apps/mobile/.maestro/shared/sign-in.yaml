# Shared step (in shared/, so `maestro test .maestro` does not run it as a flow): signs in as the demo shop's owner when the
# sign-in screen is there. PERSONA_EMAIL / PERSONA_PASSWORD come from the environment (mobile-e2e.yml in CI, -e locally),
# never from this file.
appId: com.krizaka.akinaza
---
# After clearState a slow emulator paints a blank screen first. Wait for the app to be there, signed out (its sign-in) or signed in
# (the first tab), before reading which: otherwise the blank screen reads as "signed in" and the flow taps into nothing.
- extendedWaitUntil:
    visible: "Se connecter|Sign in|Aujourd'hui|Today"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: email
    commands:
      - tapOn:
          id: email
      - inputText: ${PERSONA_EMAIL}
      - hideKeyboard
      - tapOn:
          id: password
      - inputText: ${PERSONA_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: submit
- extendedWaitUntil:
    notVisible:
      id: submit
    timeout: 30000
