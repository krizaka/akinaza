# Aujourd'hui (D8, #168, #433): the day's appointments as a list that opens into a detail, then the two moves of a visit (start, finish).
# Never a flow that depends on the clock: the CI backend (scripts/ci-mobile-backend.sh → seed-today-visit.mjs) books a puppy visit
# today at "now + 1 h" for the demo owner, so the visit is always listed. The empty day is aujourdhui-empty.yaml.
appId: com.krizaka.akinaza
tags:
  - ci
---
- runFlow: shared/launch.yaml
- runFlow: shared/sign-in.yaml
- assertVisible: "Aujourd'hui|Today"
- extendedWaitUntil:
    visible: ".*Visite chiot.*|.*Puppy visit.*"
    timeout: 30000
- takeScreenshot: aujourdhui
# The list opens into the appointment's detail (the visit is in the URL): who, where, when.
- tapOn: ".*Visite chiot.*|.*Puppy visit.*"
- assertVisible: "Qui|Who"
- takeScreenshot: aujourdhui-detail
# The two moves sit under the list of who is booked: scroll to them.
- scrollUntilVisible:
    element: "Commencer|Start"
- tapOn: "Commencer|Start"
- scrollUntilVisible:
    element: "Terminer|Finish"
    timeout: 30000
- takeScreenshot: aujourdhui-checked-in
- tapOn: "Terminer|Finish"
- scrollUntilVisible:
    element: "Terminée|Done"
    direction: UP
    timeout: 30000
- takeScreenshot: aujourdhui-checked-out
