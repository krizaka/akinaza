# The first screen opens: maestro test .maestro/smoke.yaml (a simulator with the app installed). Runs in CI (mobile-e2e.yml).
appId: com.krizaka.akinaza
tags:
  - ci
---
- launchApp:
    clearState: true
# Signed out, the app opens on sign-in (in either language): its e-mail field. After clearState a slow emulator paints a blank
# screen first, so the field is awaited (as shared/sign-in.yaml awaits its submit), not asserted at once.
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
- takeScreenshot: smoke-sign-in
